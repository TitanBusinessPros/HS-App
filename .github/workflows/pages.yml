name: Publish Homesteader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stamp published app version
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json
          for page in public/*.html; do
            sed -i "s/<meta name=\"app-version\" content=\"local\">/<meta name=\"app-version\" content=\"$GITHUB_SHA\">/" "$page"
            grep -q "name=\"app-version\" content=\"$GITHUB_SHA\"" "$page"
            sed -i -E "s/src=\"([^\"]+\.js)\"/src=\"\1?v=$GITHUB_SHA\"/g" "$page"
            grep -q "\.js?v=$GITHUB_SHA" "$page" || ! grep -q '<script' "$page"
          done
          # Version relative ES module imports as well as their HTML entry points.
          # Otherwise a cached dependency can be paired with a newer app.js.
          for script in public/*.js; do
            sed -i -E "s@(from ['\"]\./[^'\"?]+\.js)(['\"])@\1?v=$GITHUB_SHA\2@g" "$script"
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
